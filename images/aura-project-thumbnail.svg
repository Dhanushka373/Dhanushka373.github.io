    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F2EDFF"/>
      <stop offset="1" stop-color="#D6CCF1"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="750" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="24" fill="url(#glow)"/>
  <circle cx="1030" cy="92" r="190" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
  <circle cx="1030" cy="92" r="145" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>

  <g transform="translate(72 96)">
