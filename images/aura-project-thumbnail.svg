<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">AURA project thumbnail placeholder</title>
  <desc id="description">A polished yoga and wellness mobile application presentation that can be replaced with the final project thumbnail.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="1130" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#302B54"/>
      <stop offset=".48" stop-color="#17172A"/>
      <stop offset="1" stop-color="#101117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(870 150) rotate(120) scale(520 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9D8EFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/>
