    <rect x="2" y="196" width="172" height="38" rx="19" fill="#6C5CE7"/>
    <text x="88" y="221" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">UI/UX PROJECT</text>
